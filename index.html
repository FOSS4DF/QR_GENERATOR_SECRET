<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='3' fill='%23fff'/%3E%3Cg fill='none' stroke='%2312171A' stroke-width='1.6'%3E%3Crect x='.8' y='.8' width='24.4' height='24.4'/%3E%3Crect x='5' y='5' width='5.5' height='5.5'/%3E%3Crect x='15.5' y='5' width='5.5' height='5.5'/%3E%3Crect x='5' y='15.5' width='5.5' height='5.5'/%3E%3Crect x='15' y='17.6' width='6.5' height='4.4'/%3E%3Cpath d='M16.4 17.6v-1.5a1.85 1.85 0 0 1 3.7 0v1.5'/%3E%3C/g%3E%3C/svg%3E">
<title>QR Generator Secret</title>
<style>
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#12171A; --muted:#69747C;
  --rule:#DDE2E5; --rule-strong:#C2CACF; --accent:#125A63; --accent-ink:#FFFFFF;
  --warn:#9A5B00; --warn-bg:#FBF0DE; --danger:#8E2C21;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0E1113; --surface:#171B1E; --ink:#E7EAEC; --muted:#8B959C;
  --rule:#262B2F; --rule-strong:#394247; --accent:#4FA8A4; --accent-ink:#06181A;
  --warn:#E0AC63; --warn-bg:#2A2015; --danger:#E0847A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--rule);background:var(--surface)}
.hbar{display:flex;align-items:center;gap:12px;padding:14px 0}
.mark{width:26px;height:26px;flex:none;display:block}
.mark svg{width:26px;height:26px;display:block;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
h1{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0;flex:1;min-width:0}
h1 small{display:block;font-weight:400;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.ctrl{display:flex;gap:8px;align-items:center}
select,input,button{font-family:inherit;font-size:14px;color:var(--ink)}
select.lang{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--rule-strong);
  border-radius:3px;padding:6px 8px;font-size:12px;letter-spacing:.06em;font-weight:600}
.icon-btn{background:transparent;border:1px solid var(--rule-strong);border-radius:3px;width:32px;height:31px;
  display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.6}

/* ---------- sections & fields ---------- */
section{margin-top:22px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
  padding:10px 11px;font-size:15px;font-family:var(--mono)}
.field select{appearance:none;-webkit-appearance:none;font-family:var(--ui);font-size:14px;cursor:pointer}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

/* ---------- add ---------- */
.add{margin-top:0;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--surface);border:1px dashed var(--rule-strong);border-radius:3px;padding:18px;
  cursor:pointer;font-size:15px;font-weight:600;color:var(--ink)}
.add:hover,.add.drag{border-color:var(--accent);color:var(--accent)}
.add:disabled{opacity:.4;cursor:default;border-color:var(--rule-strong);color:var(--ink)}
.add svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

/* ---------- list ---------- */
.count{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:7px;margin-bottom:2px}
.count b{font-family:var(--mono);font-size:12px;font-weight:600}
.linkbtn{background:none;border:none;padding:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--danger)}
.empty{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.idx{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.rm{background:none;border:none;padding:0;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rm:hover{color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px;margin:0}
.kv dt{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:9.5px;font-weight:600;padding-top:1.5px}
.kv dd{margin:0;font-family:var(--mono);font-size:11px;word-break:break-all;line-height:1.4}
.miss{color:var(--warn);background:var(--warn-bg);padding:0 4px;border-radius:2px;font-family:var(--ui);font-size:10px;letter-spacing:.04em}

/* ---------- panels & buttons ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.ptitle{font-size:15px;font-weight:650;margin:0 0 4px}
.pdesc{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);border-radius:2px;padding:2px 6px}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--rule-strong);
  border-radius:3px;padding:6px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.ghost:disabled{opacity:.3;cursor:default}
.ghost svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:3px;padding:10px 12px;font-size:13px;margin-top:12px;background:var(--surface)}

/* ---------- bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}
.prog{position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--accent);transition:width .3s ease}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.status{flex:1;font-size:11.5px;color:var(--muted);font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{background:var(--accent);color:var(--accent-ink);border:none;border-radius:3px;padding:13px 22px;
  font-size:15px;font-weight:650;cursor:pointer;letter-spacing:.01em;white-space:nowrap}
.go:disabled{opacity:.4;cursor:default}
.go:focus-visible,.add:focus-visible,.icon-btn:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{margin:26px 0 6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule-strong);
  border-radius:3px;padding:7px 11px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  color:var(--muted);cursor:pointer;user-select:none}
.seg span svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.seg label:hover span{color:var(--ink);border-color:var(--ink)}
.seg input:checked + span{color:var(--accent);border-color:var(--accent)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.field textarea{width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
  padding:10px 11px;font-size:15px;font-family:var(--mono);color:var(--ink);resize:vertical;min-height:88px;line-height:1.45}
.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.stack{display:grid;gap:10px}
.group{display:none}
.group.active{display:grid;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding-top:22px}
.check input{width:14px;height:14px;accent-color:var(--accent);margin:0}
.opt{display:grid;gap:14px}
.opt .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.stage{display:flex;justify-content:center;align-items:center;min-height:300px;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:22px}
.plate{background:#fff;border:1px solid #C2CACF;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:310px;width:100%}
canvas#qr{width:100%;height:auto;max-width:280px;display:block}
.cap{font-family:var(--mono);font-size:11px;color:#69747C;text-align:center;word-break:break-word;min-height:1em}
.stage .empty{border:none;padding:0}
.msg{color:var(--danger);font-size:12px;margin-top:8px;min-height:1em}
.bar .ghost{padding:9px 10px}
.bar select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--rule-strong);border-radius:3px;padding:8px 8px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer}
@media(max-width:600px){.bar .ghost,.bar select{display:none}}

/* ---------- protection par mot de passe (QRS1) ---------- */
.lockt{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.lockt input{width:16px;height:16px;accent-color:var(--accent);margin:2px 0 0;flex:none;cursor:pointer}
.lockt b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:650}
.lockt b svg,.ptitle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.lockt small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.lockf{margin-top:16px;display:grid;gap:10px}
.pwrap{position:relative}
.pwrap input{width:100%;padding-right:44px!important}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;width:36px;height:36px;
  display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0;border-radius:3px}
.eye:hover{color:var(--ink)}
.eye svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.meter{display:flex;align-items:center;gap:4px}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.meter[data-l="1"] i:nth-child(1){background:var(--danger)}
.meter[data-l="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-l="3"] i:nth-child(-n+3){background:var(--accent)}
.meter[data-l="4"] i:nth-child(-n+4){background:var(--accent)}
.meter span{flex:none;min-width:92px;text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.pwact{display:flex;flex-wrap:wrap;gap:8px}
.pwmsg{font-size:12px;margin:0;min-height:1.2em;color:var(--muted);line-height:1.5}
.pwmsg.bad{color:var(--danger)}
.pwmsg.warn{color:var(--warn)}
.pwmsg.ok{color:var(--accent)}
.qwarn{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:2px;padding:7px 9px;line-height:1.45}
.seal{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#125A63}
.seal svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.hbar{padding:14px 20px}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 26 26"><rect x=".75" y=".75" width="24.5" height="24.5"/><rect x="5" y="5" width="5.5" height="5.5"/><rect x="15.5" y="5" width="5.5" height="5.5"/><rect x="5" y="15.5" width="5.5" height="5.5"/><rect x="15" y="17.6" width="6.5" height="4.4"/><path d="M16.4 17.6v-1.5a1.85 1.85 0 0 1 3.7 0v1.5"/></svg></div>
    <h1><span id="t-app">QR Generator Secret</span><small id="t-sub">Hors ligne · QR Code chiffré · PNG · SVG</small></h1>
    <div class="ctrl">
      <select class="lang" id="lang" aria-label="Langue">
        <option value="fr">FR</option><option value="en">EN</option>
        <option value="sw">SW</option><option value="ln">LN</option>
      </select>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme">
        <svg id="ticon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="eyebrow" data-k="what"></div>
    <fieldset style="border:0;margin:0;padding:0"><legend class="sr" data-k="what"></legend>
      <div class="seg" id="types"><label><input type="radio" name="type" value="link" checked><span><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><b style="font-weight:600" data-k="ty_link"></b></span></label><label><input type="radio" name="type" value="text"><span><svg viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></svg><b style="font-weight:600" data-k="ty_text"></b></span></label><label><input type="radio" name="type" value="email"><span><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13"/><path d="M3 6.5l9 6 9-6"/></svg><b style="font-weight:600" data-k="ty_email"></b></span></label><label><input type="radio" name="type" value="phone"><span><svg viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4.5-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></svg><b style="font-weight:600" data-k="ty_phone"></b></span></label><label><input type="radio" name="type" value="sms"><span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><b style="font-weight:600" data-k="ty_sms"></b></span></label><label><input type="radio" name="type" value="wifi"><span><svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".8"/></svg><b style="font-weight:600" data-k="ty_wifi"></b></span></label></div>
    </fieldset>
  </section>

  <section>
    <div class="eyebrow" data-k="content"></div>
    <div class="stack">
      <div class="group active" data-group="link">
        <div class="field"><label for="link-url" data-k="l_url"></label><input type="url" id="link-url" placeholder="example.org" autocomplete="off" spellcheck="false"></div>
        <p class="hint" style="margin-top:-2px" data-k="h_url"></p>
      </div>
      <div class="group" data-group="text">
        <div class="field"><label for="text-body" data-k="l_text"></label><textarea id="text-body" data-ph="p_text"></textarea></div>
      </div>
      <div class="group" data-group="email">
        <div class="field"><label for="email-to" data-k="l_to"></label><input type="email" id="email-to" placeholder="nom@example.org" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="email-subj" data-k="l_subj"></label><input type="text" id="email-subj" data-ph="p_subj"></div>
        <div class="field"><label for="email-body" data-k="l_msg"></label><textarea id="email-body" data-ph="p_msg"></textarea></div>
      </div>
      <div class="group" data-group="phone">
        <div class="field"><label for="phone-num" data-k="l_num"></label><input type="tel" id="phone-num" placeholder="+243 81 000 0000" autocomplete="off"></div>
        <p class="hint" style="margin-top:-2px" data-k="h_phone"></p>
      </div>
      <div class="group" data-group="sms">
        <div class="field"><label for="sms-num" data-k="l_num"></label><input type="tel" id="sms-num" placeholder="+243 81 000 0000" autocomplete="off"></div>
        <div class="field"><label for="sms-body" data-k="l_msg"></label><textarea id="sms-body" data-ph="p_sms"></textarea></div>
      </div>
      <div class="group" data-group="wifi">
        <div class="field"><label for="wifi-ssid" data-k="l_ssid"></label><input type="text" id="wifi-ssid" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="wifi-pass" data-k="l_pass"></label><input type="text" id="wifi-pass" autocomplete="off" spellcheck="false"></div>
        <div class="fields">
          <div class="field"><label for="wifi-enc" data-k="l_sec"></label>
            <select id="wifi-enc"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass" data-k="o_open"></option></select></div>
          <label class="check"><input type="checkbox" id="wifi-hidden"><span data-k="l_hidden"></span></label>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="eyebrow" data-k="protect"></div>
    <div class="panel" id="lockp">
      <label class="lockt"><input type="checkbox" id="lock-on"><span><b><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><span data-k="lock_on"></span></b><small data-k="lock_sub"></small></span></label>
      <div class="lockf" id="lock-fields" hidden>
        <div class="fields">
          <div class="field"><label for="pw1" data-k="pw1"></label><div class="pwrap"><input type="password" id="pw1" autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off"><button class="eye" id="eye" type="button"><svg id="eye-i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div class="field"><label for="pw2" data-k="pw2"></label><div class="pwrap"><input type="password" id="pw2" autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off"></div></div>
        </div>
        <div class="meter" id="meter" data-l="0" aria-live="polite"><i></i><i></i><i></i><i></i><span id="meter-l"></span></div>
        <p class="pwmsg" id="pw-msg" role="status" aria-live="polite"></p>
        <div class="pwact">
          <button class="ghost" id="pw-gen" type="button"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span data-k="gen"></span></button>
          <button class="ghost" id="pw-copy" type="button"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/></svg><span data-k="pwcopy"></span></button>
        </div>
        <div class="qwarn" data-k="noRecover"></div>
        <p class="hint" style="margin-top:0" data-k="scanNote"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="eyebrow" data-k="preview"></div>
    <div class="stage">
      <div class="plate" id="plate">
        <div class="seal" id="seal" hidden><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><span data-k="sealed"></span></div>
        <canvas id="qr" width="280" height="280" aria-label="QR"></canvas>
        <div class="cap" id="cap"></div>
      </div>
      <div class="empty" id="empty" hidden></div>

/* ============================================================
   QRS1 — chiffrement par mot de passe (Web Crypto, hors ligne)
   Contenu du QR code : "QRS1:" + Base45( en-tête ‖ sel ‖ IV ‖ chiffré ‖ tag )
     en-tête (5 o) : version 0x01 ‖ itérations PBKDF2 (uint32, big-endian)
     sel 16 o · IV 12 o · tag GCM 16 o
   Clé  : PBKDF2-HMAC-SHA256( mot de passe UTF-8 normalisé NFC, sel, itérations ) → 256 bits
   Algo : AES-256-GCM, données associées (AAD) = "QRS1" ‖ en-tête
   Base45 : RFC 9285 (alphabet du mode alphanumérique des QR codes)
   ============================================================ */
var QRS={PREFIX:"QRS1:",VERSION:1,ITER:600000,MIN_ITER:10000,MAX_ITER:2000000,SALT:16,IV:12,TAG:16};
var HAS_CRYPTO=!!(window.crypto&&window.crypto.subtle&&window.TextEncoder&&window.TextDecoder);
var B45="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";
function b45enc(u8){
  var s="";
  for(var i=0;i<u8.length;i+=2){
    if(i+1<u8.length){ var n=u8[i]*256+u8[i+1]; s+=B45[n%45]+B45[Math.floor(n/45)%45]+B45[Math.floor(n/2025)]; }
    else { var m=u8[i]; s+=B45[m%45]+B45[Math.floor(m/45)]; }
  }
  return s;
}
function b45dec(s){
  if(s.length%3===1) throw new Error("b45 length");
  var out=new Uint8Array(Math.floor(s.length/3)*2+(s.length%3?1:0)), o=0;
  for(var i=0;i<s.length;i+=3){
    var c=B45.indexOf(s[i]), d=B45.indexOf(s[i+1]);
    if(c<0||d<0) throw new Error("b45 char");
    if(i+2<s.length){
      var e=B45.indexOf(s[i+2]); if(e<0) throw new Error("b45 char");
      var n=c+d*45+e*2025; if(n>65535) throw new Error("b45 value");
      out[o++]=n>>8; out[o++]=n&255;
    } else {
      var n2=c+d*45; if(n2>255) throw new Error("b45 value");
      out[o++]=n2;
    }
  }

}
function u8cat(){ var len=0,i; for(i=0;i<arguments.length;i++) len+=arguments[i].length; var r=new Uint8Array(len),p=0; for(i=0;i<arguments.length;i++){ r.set(arguments[i],p); p+=arguments[i].length; } return r; }

function qrsAad(hdr){ return u8cat(new TextEncoder().encode("QRS1"),hdr); }
function qrsDeriveKey(pass,salt,iter){
  var pw=new TextEncoder().encode(String(pass).normalize("NFC"));
  return crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);

function qrsEncrypt(text,key,salt,iter){
  var iv=crypto.getRandomValues(new Uint8Array(QRS.IV)), hdr=qrsHeader(iter);

/* Analyse un contenu lu : null = pas un QR code chiffré ; {bad:...} = format invalide */
function qrsParse(raw){
  if(typeof raw!=="string") return null;
  raw=raw.replace(/[\r\n\t]+$/,""); // l'espace fait partie de l'alphabet Base45 : seuls \r \n \t sont retirés
  if(raw.indexOf(QRS.PREFIX)!==0) return null;
  var b; try{ b=b45dec(raw.slice(QRS.PREFIX.length)); }catch(e){ return {bad:"format"}; }
  if(b.length<5+QRS.SALT+QRS.IV+QRS.TAG) return {bad:"format"};
  if(b[0]!==QRS.VERSION) return {bad:"version",ver:b[0]};
  var iter=b[1]*16777216+b[2]*65536+b[3]*256+b[4];
  if(iter<QRS.MIN_ITER||iter>QRS.MAX_ITER) return {bad:"iter",iter:iter};
  return {ver:b[0],iter:iter,hdr:b.slice(0,5),salt:b.slice(5,5+QRS.SALT),iv:b.slice(5+QRS.SALT,5+QRS.SALT+QRS.IV),ct:b.slice(5+QRS.SALT+QRS.IV),size:b.length};
}
function qrsDecrypt(p,key){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:p.iv,additionalData:qrsAad(p.hdr),tagLength:128},key,p.ct)
    .then(function(pt){ return new TextDecoder("utf-8",{fatal:true}).decode(pt); });
}

  }
  if(ty==='phone'){ var p=val('phone-num').replace(/[^\d+]/g,''); return p?'tel:'+p:''; }

/* ---------- mot de passe ---------- */
function lockOn(){ return document.getElementById('lock-on').checked; }
function pwStrength(p){
  if(!p) return 0;
  var pool=0;
  if(/[a-z]/.test(p)) pool+=26; if(/[A-Z]/.test(p)) pool+=26; if(/\d/.test(p)) pool+=10; if(/[^A-Za-z0-9]/.test(p)) pool+=33;
  var bits=p.length*Math.log(Math.max(pool,2))/Math.LN2;
  if(/^(.)\1*$/.test(p)) bits=Math.min(bits,8);
  if(/(passw|motdepasse|mot de passe|123456|azerty|qwerty|admin|letmein|0000|1111)/i.test(p)) bits=Math.min(bits,24);
  return bits<45?1:bits<65?2:bits<90?3:4;
}
function pwCheck(){
  var a=val('pw1').normalize('NFC'), b=val('pw2').normalize('NFC');
  if(!a) return {ok:false,msg:'',cls:''};
  if(Array.from(a).length<8) return {ok:false,msg:t('pwShort'),cls:'bad'};
  if(a!==b) return {ok:false,msg:b?t('pwMismatch'):'',cls:b?'bad':''};
  return {ok:true,pass:a};
}
function updatePwUI(){

  $('#meter').setAttribute('data-l',lv); $('#meter-l').textContent=t('s'+lv);
  var c=pwCheck(), m=$('#pw-msg'), txt='', cls='';
  if(state.genFlag&&c.ok){ txt=t('pwGenDone'); cls='ok'; }
  else if(!c.ok){ txt=c.msg; cls=c.cls; }

  else { txt=t('pwOk'); cls='ok'; }

  $('#pw-copy').disabled=!p;
}

function genPassword(){
  // 20 caractères tirés sans biais (rejet) dans un alphabet sans caractères ambigus : ≈ 117 bits
  var A="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", lim=A.length*Math.floor(256/A.length), ch=[], buf=new Uint8Array(32);
  while(ch.length<20){ crypto.getRandomValues(buf); for(var i=0;i<buf.length&&ch.length<20;i++) if(buf[i]<lim) ch.push(A[buf[i]%A.length]); }
  return [0,5,10,15].map(function(i){ return ch.slice(i,i+5).join(''); }).join('-');
}
function copyText(s,done){
  function fallback(){ var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done(); }

/* clé dérivée gardée en mémoire tant que le mot de passe ne change pas (nouveau sel à chaque changement) */
var keyCache={pass:null,salt:null,key:null,pending:null}, encCache={pass:null,payload:null,out:null};
function wipeKeys(){ keyCache={pass:null,salt:null,key:null,pending:null}; encCache={pass:null,payload:null,out:null}; }
function getKey(pass){
  if(keyCache.pass===pass&&keyCache.key) return Promise.resolve(keyCache);
  if(keyCache.pass===pass&&keyCache.pending) return keyCache.pending;
  var salt=crypto.getRandomValues(new Uint8Array(QRS.SALT));
  keyCache={pass:pass,salt:salt,key:null,pending:null};
  keyCache.pending=qrsDeriveKey(pass,salt,QRS.ITER).then(function(k){
    if(keyCache.pass===pass&&keyCache.salt===salt){ keyCache.key=k; keyCache.pending=null; } // ignore une dérivation périmée
    return {pass:pass,salt:salt,key:k};
  });
  return keyCache.pending;
}

/* ---------- render ---------- */
var seq=0;
function showEmpty(text){
  plate.hidden=true; empty.hidden=false; empty.textContent=text; state.matrix=null; state.sealed=false; setButtons(false);
}
function render(){
  var my=++seq;
  var payload=buildPayload();
  state.payload=payload; state.fg=currentFg(); msg.textContent='';
  updatePwUI();
  if(!lockOn()){
    status('');
    if(!payload){ showEmpty(t('empty')); return; }
    draw(payload,'Byte',captionFor(payload),false); return;
  }
  if(!HAS_CRYPTO){ showEmpty(t('noCrypto')); return; }
  var c=pwCheck();
  if(!c.ok){ status(''); showEmpty(t('needPw')); return; }
  if(!payload){ status(''); showEmpty(t('empty')); return; }
  if(encCache.pass===c.pass&&encCache.payload===payload&&encCache.out){ draw(encCache.out,'Alphanumeric',sealCaption(encCache.out),true); return; }
  setButtons(false); status(t('encrypting'));
  if(!(keyCache.pass===c.pass&&keyCache.key)) showEmpty(t('encrypting'));
  getKey(c.pass).then(function(k){ return qrsEncrypt(payload,k.key,k.salt,QRS.ITER); }).then(function(out){
    if(my!==seq) return;
    encCache={pass:c.pass,payload:payload,out:out};
    draw(out,'Alphanumeric',sealCaption(out),true);
  }).catch(function(err){
    if(my!==seq) return; if(window.console) console.error(err); status(''); showEmpty(t('noCrypto'));
  });
}
function sealCaption(s){ return s.length>40?s.slice(0,37)+'…':s; }
function draw(data,mode,caption,sealed){
  var qr;
  try{ qr=qrcode(0,currentEcl()); qr.addData(data,mode); qr.make(); }
  catch(err){ plate.hidden=true; empty.hidden=true; msg.textContent=t('tooBig'); state.matrix=null; state.sealed=false; setButtons(false); status(''); return; }
  var n=qr.getModuleCount(), m=[];
  for(var r=0;r<n;r++){ var row=[]; for(var c=0;c<n;c++) row.push(qr.isDark(r,c)); m.push(row); }
  state.matrix=m; state.count=n; state.sealed=sealed;
  plate.hidden=false; empty.hidden=true; seal.hidden=!sealed;
  drawTo(canvas,n,m,280,state.fg);
  cap.textContent=caption;
  setButtons(true);
  status(sealed?('AES-256-GCM · PBKDF2 '+QRS.ITER.toLocaleString('fr-FR').replace(/ | /g,' ')+' · QR v'+((n-17)/4)):'');
}
function drawTo(cv,n,m,targetPx,fg){
  var quiet=4, total=n+quiet*2, cell=Math.max(1,Math.floor(targetPx/total)), size=cell*total;
  cv.width=size; cv.height=size;
  var c=cv.getContext('2d');
  c.fillStyle='#FFFFFF'; c.fillRect(0,0,size,size); c.fillStyle=fg;
  for(var r=0;r<n;r++) for(var col=0;col<n;col++){ if(m[r][col]) c.fillRect((col+quiet)*cell,(r+quiet)*cell,cell,cell); }
}
function setButtons(on){ $('#dl-png').disabled=!on; $('#dl-svg').disabled=!on; $('#copy').disabled=!on; }

/* ---------- downloads ---------- */
function fileBase(){
  if(state.sealed) return 'qr-secret'; // le nom du fichier ne doit rien révéler du contenu chiffré
  var ty=currentType();
  var raw=(ty==='wifi'?val('wifi-ssid'):(ty==='link'?val('link-url'):state.payload))||'qr-code';
  return raw.replace(/^https?:\/\//,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,40).toLowerCase()||'qr-code';
}
function downloadPNG(){

}
function buildSVG(){
  var n=state.count, m=state.matrix, quiet=4, total=n+quiet*2, fg=state.fg, path='';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++){ if(m[r][c]) path+='M'+(c+quiet)+' '+(r+quiet)+'h1v1h-1z'; }

    '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 '+total+' '+total+'" shape-rendering="crispEdges">'+
    '<rect width="'+total+'" height="'+total+'" fill="#FFFFFF"/>'+'<path d="'+path+'" fill="'+fg+'"/></svg>';
}

function triggerDownload(url,name){ var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
function copyImage(){

  var off=document.createElement('canvas'); drawTo(off,state.count,state.matrix,1024,state.fg);
  if(!off.toBlob||!navigator.clipboard||!window.ClipboardItem){ msg.textContent=t('noCopy'); return; }
  off.toBlob(function(blob){
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
      msg.textContent=''; var c=$('#copy'); c.textContent=t('copied');
      setTimeout(function(){ c.textContent=t('copy'); },1400);
    }).catch(function(){ msg.textContent=t('copyFail'); });
  },'image/png');
}

/* ---------- wiring ---------- */
function showGroup(ty){ $$('.group').forEach(function(g){ g.classList.toggle('active',g.getAttribute('data-group')===ty); }); }
var timer=null;
function debounced(){ clearTimeout(timer); if(lockOn()) setButtons(false); timer=setTimeout(render,120); }
function debouncedPw(){ clearTimeout(timer); setButtons(false); updatePwUI(); timer=setTimeout(render,350); }
$$('input[name=type]').forEach(function(el){ el.addEventListener('change',function(){ showGroup(currentType()); render(); }); });
$$('input[name=ecl], input[name=fg]').forEach(function(el){ el.addEventListener('change',render); });
$$('.stack input, .stack textarea, .stack select').forEach(function(el){ el.addEventListener('input',debounced); el.addEventListener('change',render); });
['#pw1','#pw2'].forEach(function(s){ $(s).addEventListener('input',function(){ state.genFlag=false; debouncedPw(); }); });
$('#lock-on').addEventListener('change',function(){ if(!lockOn()) wipeKeys(); render(); if(lockOn()) $('#pw1').focus(); });
$('#eye').addEventListener('click',function(){ setEye(!pwVisible); });
$('#pw-gen').addEventListener('click',function(){
  var p=genPassword(); $('#pw1').value=p; $('#pw2').value=p; state.genFlag=true; setEye(true); render();
});
$('#pw-copy').addEventListener('click',function(){
  var p=val('pw1'); if(!p) return; var b=$('#pw-copy span');
  copyText(p,function(){ b.textContent=t('copied'); setTimeout(function(){ b.textContent=t('pwcopy'); },1400); });
});
$('#dl-png').addEventListener('click',downloadPNG);
$('#dl-svg').addEventListener('click',downloadSVG);
$('#copy').addEventListener('click',copyImage);
window.addEventListener('pagehide',function(){ wipeKeys(); });

showGroup('link');
bootChrome();
})();
</script>
</body>
</html>
